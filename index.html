<!DOCTYPE html>
<html>
<head>
  <title>RecipeJS App</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    button {
      margin: 5px;
      padding: 8px 12px;
      cursor: pointer;
    }
    li {
      margin: 8px 0;
    }
  </style>
</head>
<body>

<h1>RecipeJS App</h1>

<h3>Filter Recipes</h3>
<button onclick="setFilter('ALL')">All Recipes</button>
<button onclick="setFilter('EASY')">Easy Recipes</button>
<button onclick="setFilter('MEDIUM')">Medium Recipes</button>
<button onclick="setFilter('HARD')">Hard Recipes</button>
<button onclick="setFilter('QUICK')">Quick Recipes (<30 mins)</button>

<h3>Sort Recipes</h3>
<button onclick="setSort('NAME')">Name (A–Z)</button>
<button onclick="setSort('TIME')">Time (Fastest First)</button>

<h3>Recipe List</h3>
<ul id="recipeList"></ul>

<script>
/* ---------------- Original Data ---------------- */

const recipes = [
  { name: "Pasta", difficulty: "Easy", time: 20 },
  { name: "Biryani", difficulty: "Hard", time: 60 },
  { name: "Salad", difficulty: "Easy", time: 10 },
  { name: "Burger", difficulty: "Medium", time: 30 },
  { name: "Fried Rice", difficulty: "Medium", time: 25 }
];

/* ---------------- State ---------------- */

let currentFilter = "ALL";
let currentSort = "NAME";

/* ---------------- Pure Filter Function ---------------- */

function filterRecipes(list, filterType) {
  switch (filterType) {
    case "EASY":
      return list.filter(recipe => recipe.difficulty === "Easy");

    case "MEDIUM":
      return list.filter(recipe => recipe.difficulty === "Medium");

    case "HARD":
      return list.filter(recipe => recipe.difficulty === "Hard");

    case "QUICK":
      return list.filter(recipe => recipe.time < 30);

    default:
      return list;
  }
}

/* ---------------- Pure Sort Function ---------------- */

function sortRecipes(list, sortType) {
  const copiedList = [...list]; // avoid mutating original

  switch (sortType) {
    case "TIME":
      return copiedList.sort((a, b) => a.time - b.time);

    case "NAME":
    default:
      return copiedList.sort((a, b) => 
        a.name.localeCompare(b.name)
      );
  }
}

/* ---------------- Render Function ---------------- */

function renderRecipes(list) {
  const ul = document.getElementById("recipeList");
  ul.innerHTML = "";

  list.forEach(recipe => {
    const li = document.createElement("li");
    li.textContent = `${recipe.name} - ${recipe.difficulty} - ${recipe.time} mins`;
    ul.appendChild(li);
  });
}

/* ---------------- Central Update Function ---------------- */

function updateDisplay() {
  const filtered = filterRecipes(recipes, currentFilter);
  const sorted = sortRecipes(filtered, currentSort);
  renderRecipes(sorted);
}

/* ---------------- Button Handlers ---------------- */

function setFilter(type) {
  currentFilter = type;
  updateDisplay();
}

function setSort(type) {
  currentSort = type;
  updateDisplay();
}

/* ---------------- Initial Load ---------------- */

updateDisplay();

</script>

</body>
</html>
