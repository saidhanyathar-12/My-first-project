<!DOCTYPE html>
<html>
<head>
  <title>RecipeJS App</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    button {
      margin: 5px;
      padding: 8px 12px;
      cursor: pointer;
    }
    li {
      margin: 8px 0;
    }
  </style>
</head>
<body>

<h1>RecipeJS App</h1>

<h3>Filter Recipes</h3>
<button onclick="setFilter('ALL')">All Recipes</button>
<button onclick="setFilter('EASY')">Easy Recipes</button>
<button onclick="setFilter('MEDIUM')">Medium Recipes</button>
<button onclick="setFilter('HARD')">Hard Recipes</button>
<button onclick="setFilter('QUICK')">Quick Recipes (<30 mins)</button>

<h3>Sort Recipes</h3>
<button onclick="setSort('NAME')">Name (A–Z)</button>
<button onclick="setSort('TIME')">Time (Fastest First)</button>

<h3>Recipe List</h3>
<ul id="recipeList"></ul>
<script>
const RecipeApp = (function () {

  const recipes = [
    {
      name: "Pasta",
      difficulty: "Easy",
      time: 20,
      ingredients: ["Pasta", "Salt", "Sauce"],
      steps: [
        "Boil water",
        "Cook pasta",
        "Add sauce"
      ]
    },
    {
      name: "Biryani",
      difficulty: "Hard",
      time: 60,
      ingredients: ["Rice", "Chicken", "Masala"],
      steps: [
        "Cook rice",
        {
          text: "Prepare chicken",
          substeps: [
            "Add spices",
            "Cook chicken"
          ]
        },
        "Mix and serve"
      ]
    }
  ];

  let currentFilter = "ALL";
  let currentSort = "NAME";

  function filterRecipes(list, filterType) {
    switch (filterType) {
      case "EASY":
        return list.filter(r => r.difficulty === "Easy");
      case "MEDIUM":
        return list.filter(r => r.difficulty === "Medium");
      case "HARD":
        return list.filter(r => r.difficulty === "Hard");
      case "QUICK":
        return list.filter(r => r.time < 30);
      default:
        return list;
    }
  }

  function sortRecipes(list, sortType) {
    const copied = [...list];
    if (sortType === "TIME") return copied.sort((a,b)=>a.time-b.time);
    return copied.sort((a,b)=>a.name.localeCompare(b.name));
  }

  /* -------- Recursive Steps Render -------- */

  function renderSteps(steps) {
    const ul = document.createElement("ul");

    steps.forEach(step => {
      const li = document.createElement("li");

      if (typeof step === "string") {
        li.textContent = step;
      } else {
        li.textContent = step.text;
        if (step.substeps) {
          li.appendChild(renderSteps(step.substeps));
        }
      }
      ul.appendChild(li);
    });

    return ul;
  }

  /* -------- Render Recipes -------- */

  function renderRecipes(list) {
    const ul = document.getElementById("recipeList");
    ul.innerHTML = "";

    list.forEach((recipe, index) => {
      const li = document.createElement("li");

      li.innerHTML = `
        <strong>${recipe.name}</strong> - ${recipe.difficulty} - ${recipe.time} mins
        <br>
        <button data-type="steps" data-index="${index}">Show Steps</button>
        <button data-type="ingredients" data-index="${index}">Show Ingredients</button>
        <div id="details-${index}"></div>
      `;

      ul.appendChild(li);
    });
  }

  function updateDisplay() {
    const filtered = filterRecipes(recipes, currentFilter);
    const sorted = sortRecipes(filtered, currentSort);
    renderRecipes(sorted);
  }

  function setFilter(type) {
    currentFilter = type;
    updateDisplay();
  }

  function setSort(type) {
    currentSort = type;
    updateDisplay();
  }

  /* -------- Event Delegation -------- */

  function handleClicks(e) {
    if (!e.target.dataset.type) return;

    const index = e.target.dataset.index;
    const type = e.target.dataset.type;
    const container = document.getElementById(`details-${index}`);
    const recipe = recipes[index];

    if (container.innerHTML !== "") {
      container.innerHTML = "";
      return;
    }

    if (type === "ingredients") {
      container.innerHTML = "<ul>" +
        recipe.ingredients.map(i=>`<li>${i}</li>`).join("") +
        "</ul>";
    }

    if (type === "steps") {
      container.appendChild(renderSteps(recipe.steps));
    }
  }

  function init() {
    window.setFilter = setFilter;
    window.setSort = setSort;
    document.getElementById("recipeList").addEventListener("click", handleClicks);
    updateDisplay();
  }

  return { init };

})();

RecipeApp.init();
</script>
